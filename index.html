<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent & Analytics Best Practice Playbook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --sidebar-width: 360px;
    --header-height: 48px;
    --bg: #f0f4f8;
    --sidebar-bg: #071D49;
    --sidebar-text: #c8d8f0;
    --sidebar-hover: #0d2d6b;
    --sidebar-active: #00B5E2;
    --sidebar-active-bg: #0a2560;
    --content-bg: #ffffff;
    --border: #d6e4f0;
    --text: #071D49;
    --muted: #5a6e8a;
    --accent: #005EB8;
    --code-bg: #f0f6fb;
    --code-border: #c8ddf0;
    --h1-color: #071D49;
    --h2-color: #071D49;
    --h3-color: #005EB8;
    --link-color: #005EB8;
    --table-header: #e0f4fb;
    --table-border: #99ddf2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Top bar ── */
  header {
    height: var(--header-height);
    background: #071D49;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    z-index: 100;
  }
  header svg { flex-shrink: 0; }
  header span { font-size: 15px; font-weight: 600; letter-spacing: .3px; }

  /* ── Body layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  aside {
    width: var(--sidebar-width);
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
    border-right: 1px solid #0d2d6b;
    transition: width .2s ease;
  }
  aside.collapsed { width: 0; }

  .sidebar-header {
    padding: 12px 14px 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #7a9cc0;
    border-bottom: 1px solid #0d2d6b;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #toc {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }
  #toc::-webkit-scrollbar { width: 4px; }
  #toc::-webkit-scrollbar-thumb { background: #1a4080; border-radius: 2px; }

  .toc-item {
    display: block;
    padding: 5px 14px;
    cursor: pointer;
    color: var(--sidebar-text);
    font-size: 13px;
    line-height: 1.4;
    border-left: 3px solid transparent;
    transition: background .12s, color .12s, border-color .12s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-decoration: none;
  }
  .toc-item:hover { background: var(--sidebar-hover); color: #fff; }
  .toc-item.active {
    background: var(--sidebar-active-bg);
    color: var(--sidebar-active);
    border-left-color: var(--sidebar-active);
    font-weight: 600;
  }
  .toc-h1 { font-size: 13px; font-weight: 700; color: #00B5E2; padding-left: 14px; }
  .toc-h2 { font-size: 13px; padding-left: 14px; font-weight: 600; }
  .toc-h3 { font-size: 12px; padding-left: 20px; color: #8ab8d8; }
  .toc-h4 { font-size: 11px; padding-left: 38px; color: #6a9ab8; }
  .toc-h3::before {
    content: '▶';
    font-size: 8px;
    display: inline-block;
    margin-right: 5px;
    transition: transform .18s ease;
    opacity: .7;
  }
  .toc-h3.open::before { transform: rotate(90deg); }

  /* ── Main content ── */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 40px 56px;
    background: var(--bg);
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 4px; }
  main::-webkit-scrollbar-thumb:hover { background: #999; }

  #content {
    max-width: 860px;
    margin: 0 auto;
    background: var(--content-bg);
    border-radius: 8px;
    padding: 48px 56px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }

  /* ── Markdown styles ── */
  #content h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--h1-color);
    border-bottom: 3px solid #00B5E2;
    padding-bottom: 12px;
    margin: 0 0 28px;
    letter-spacing: -.3px;
  }
  #content h2 {
    font-size: 21px;
    font-weight: 700;
    color: var(--h2-color);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin: 40px 0 18px;
  }
  #content h3 {
    font-size: 17px;
    font-weight: 600;
    color: var(--h3-color);
    margin: 28px 0 12px;
  }
  #content h4 {
    font-size: 15px;
    font-weight: 600;
    color: #071D49;
    margin: 20px 0 8px;
  }
  #content p { line-height: 1.75; margin: 0 0 14px; color: #2a3a50; }
  #content a { color: var(--link-color); text-decoration: none; }
  #content a:hover { text-decoration: underline; }
  #content strong { font-weight: 700; color: #071D49; }

  #content ul, #content ol {
    margin: 8px 0 16px 24px;
    line-height: 1.8;
  }
  #content li { margin-bottom: 4px; color: #2a3a50; }
  #content li > ul { margin-top: 4px; margin-bottom: 4px; }

  #content code {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: 13px;
    color: #005EB8;
  }
  #content pre {
    background: #071D49;
    border-radius: 8px;
    padding: 20px 24px;
    overflow-x: auto;
    margin: 18px 0;
    border-left: 4px solid #00B5E2;
    box-shadow: inset 0 0 0 1px #0d2d6b;
  }
  #content pre code {
    background: none;
    border: none;
    padding: 0;
    color: #c8e8f8;
    font-size: 13px;
    line-height: 1.65;
  }

  #content table {
    width: 100%;
    border-collapse: collapse;
    margin: 18px 0;
    font-size: 14px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  #content th {
    background: var(--table-header);
    color: #071D49;
    font-weight: 700;
    padding: 11px 14px;
    text-align: left;
    border-bottom: 2px solid var(--table-border);
  }
  #content td {
    padding: 9px 14px;
    border-bottom: 1px solid #e8f0f8;
    color: #2a3a50;
  }
  #content tr:last-child td { border-bottom: none; }
  #content tr:hover td { background: #f0f8fd; }

  #content blockquote {
    border-left: 4px solid #00B5E2;
    background: #e0f4fb;
    padding: 12px 18px;
    margin: 18px 0;
    border-radius: 0 6px 6px 0;
    color: #071D49;
    font-style: italic;
  }

  #content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }

  /* Toggle button */
  #toggle-btn {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.3);
    cursor: pointer;
    color: #fff;
    padding: 6px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .12s, border-color .12s;
  }
  #toggle-btn:hover {
    background: rgba(255,255,255,.22);
    border-color: rgba(255,255,255,.7);
  }
  #toggle-btn:focus-visible { outline: 3px solid #00B5E2; outline-offset: 2px; }

  /* Progress bar */
  #progress {
    position: fixed;
    top: var(--header-height);
    left: 0;
    height: 3px;
    background: #00B5E2;
    width: 0%;
    z-index: 200;
    transition: width .1s;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    aside { width: 0; }
    aside:not(.collapsed) { width: min(85vw, var(--sidebar-width)); }
    #content { padding: 28px 20px; }
    main { padding: 20px 12px; }
  }
</style>
</head>
<body>

<div id="progress"></div>

<header>
  <button id="toggle-btn" title="Toggle Table of Content" aria-label="Toggle Table of Content" aria-expanded="false" aria-controls="sidebar">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <!-- Book icon -->
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  </svg>
  <span>AI Agent &amp; Analytics Best Practice Playbook</span>
</header>

<div class="layout">
  <aside id="sidebar" class="collapsed">
    <div class="sidebar-header">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      Table of Contents
    </div>
    <nav id="toc"></nav>
  </aside>

  <main id="main-scroll">
    <div id="content"></div>
  </main>
</div>

<script>
const FALLBACK_MD = `# AI Agent & Analytics Best Practice Playbook

## 1. Introducion

### Purpose

This playbook helps AbbVie Analytics team members use **Claude Code for Agentic Coding**. 

This playbook contains:
- **Hands-on Training** guides built by APEX, to enable and accelerate agentic coding skillset. 
- **Internal Curated Resources** (e.g. Use Cases, AbbVie tech stack integrations)
- **External Curated Resources** (e.g. free resources, training recommendations, further reading, etc.)   

### Not in Initial Scope (will be revisited later)

- Using go/ai or in-browser LLM chats such as https://gemini.google.com/.
- AWS Bedrock & AWS Sagemaker Unified Studio guide.
- Building on a Remote Server such as EC2 or EKS.

###  Brief Overview of Claude Code

Claude Code is not just a chat window. It is an agent that works through a continuous **Read -> Decide -> Act -> Observe** loop:

1. **Reads** - Opens files, searches code, and inspects the current state.
2. **Decides** - Selects the next action from its available tools.
3. **Acts** - Edits files, runs tests, or calls approved APIs.
4. **Observes** - Reviews the result and uses it to decide what to do next.

This loop allows Claude Code to complete multi-step tasks and build assets while you guide and validate its work. This emerging style of working allows one to unlock significant acceleration to completing work, even more-so than using the one-on-one chat interface that we have at go/AI or google gemini. It also creates a new set of challenges to think about in that the more you let the AI run-the-show, the more risk you introduce to the solution being a black-box. 

## 2. Hands-on Training Content for Agentic Coding

By working through these hand-on job aids you will gain a good understanding of agentic coding at AbbVie. 

[AA&I Agentic Coding | 101 - From Scratch](https://abbvie.sharepoint.com/:w:/r/sites/APEX-AdvancedAnalyticsInnovation/Shared%20Documents/General/Onboarding%20Resources/Software,%20Platforms,%20Data,%20%26%20Access/APEX%20AA%26I%20Agentic%20Coding%20101%20-%20From%20Scratch.docx?web=1) The groundwork to getting Claude Code set up for yourself.

[AA&I Agentic Coding | 102 - Agents.md & Workflows:](https://abbvie.sharepoint.com/:w:/r/sites/APEX-AdvancedAnalyticsInnovation/Shared%20Documents/General/Onboarding%20Resources/Software,%20Platforms,%20Data,%20%26%20Access/APEX%20AA%26I%20Agentic%20Coding%20102%20-%20Agents%20Markdown%20Best%20Practices.docx?web=1) A high level overview of agents and ways to work with Claude Code.

[AA&I Agentic Coding | 201 - AbbVie Ways of Working](https://abbvie.sharepoint.com/:w:/r/sites/APEX-AdvancedAnalyticsInnovation/Shared%20Documents/General/Onboarding%20Resources/Software,%20Platforms,%20Data,%20%26%20Access/APEX%20AA%26I%20Agentic%20Coding%20201%20-%20AbbVie%20Ways%20of%20Working.docx?web=1) Will help you work with Claude Code leveraging AbbVie's current infrastrucutre. Connect to Snowflake and Trino. Leverage VS Code Plugin.

[AA&I Agentic Coding | 301 - BYO XGBoost Solution Example](https://abbvie.sharepoint.com/:w:/r/sites/APEX-AdvancedAnalyticsInnovation/Shared%20Documents/General/Onboarding%20Resources/Software,%20Platforms,%20Data,%20%26%20Access/APEX%20AA%26I%20Agentic%20Coding%20301%20-%20BYO%20XGBoost.docx?web=1) A hands on walkthrough to build your own dataset agnostic YOLO regression solution. 

## 3A. More to Explore - Internal Curated Resources

[Open the MHI Agent Playbook](https://abbvie.sharepoint.com/:b:/r/sites/APEX-AdvancedAnalyticsInnovation/Shared%20Documents/General/2026/APEX%20AI/MHI%20Agent%20Playbook.pdf?web=1)

[Open the Suggestion Holistic Analysis AI Agent](https://abbvie.sharepoint.com/:u:/r/sites/APEX-AdvancedAnalyticsInnovation/Shared%20Documents/General/2026/APEX%20AI/suggestions_ai_project.html?web=1)

[Open the COMPASS overview](https://abbvie.sharepoint.com/:t:/r/sites/APEX-AdvancedAnalyticsInnovation/Shared%20Documents/General/2026/APEX%20AI/COMPASS_Overview.md?web=1)

[Claude Deep Dive](https://abbvie.sharepoint.com/:t:/r/sites/APEX-AdvancedAnalyticsInnovation/Shared%20Documents/General/2026/APEX%20AI/Claude%20training%20deck.pdf?web=1)

## 3B. More to Explore - External Curated Resources

(Coming soon)

## Appendix A: Credits & Acknowledgments

This playbook builds on the work and generosity of many across AbbVie.

- **Kevin O'Donnell** — for content and guidance that shaped this playbook.
- **And colleagues across AbbVie** whose materials, workflows, and early experiments informed what we built here — including the teams behind the MHI Agent, Suggestion Holistic Analysis, and COMPASS playbooks, and the authors of the onboarding and training resources referenced throughout.

*If your contribution is missing here, let us know — this section is meant to grow.*


`;

function render(md) {
  document.getElementById('content').innerHTML = marked.parse(md);
  document.querySelectorAll('#content a').forEach(a => {
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  });
  buildToc();
}

// ── Try fetch first; fall back to embedded content ──
fetch('AI Agent & Analytics Best Practice Playbook.md')
  .then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  })
  .then(render)
  .catch(() => render(FALLBACK_MD));

function buildToc() {
  const toc = document.getElementById('toc');
  const headings = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4');
  const tocItems = [];

  headings.forEach((h, i) => {
    const id = 'heading-' + i;
    h.id = id;
    const level = parseInt(h.tagName[1]);
    const a = document.createElement('a');
    a.className = `toc-item toc-h${level}`;
    a.textContent = h.textContent;
    a.href = '#' + id;
    a.dataset.level = level;

    if (level >= 4) a.style.display = 'none';

    a.addEventListener('click', e => {
      e.preventDefault();
      if (level === 3) {
        const wasOpen = a.classList.contains('open');
        a.classList.toggle('open');
        // show/hide following h4 siblings until next h1/h2/h3
        let sib = a.nextElementSibling;
        while (sib && sib.dataset.level >= 4) {
          sib.style.display = wasOpen ? 'none' : '';
          sib = sib.nextElementSibling;
        }
      }
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    toc.appendChild(a);
    tocItems.push({ el: a, heading: h, level });
  });

  function expandParentH3(activeIdx) {
    for (let i = activeIdx - 1; i >= 0; i--) {
      if (tocItems[i].level <= 3) {
        if (tocItems[i].level === 3 && !tocItems[i].el.classList.contains('open')) {
          tocItems[i].el.classList.add('open');
          let sib = tocItems[i].el.nextElementSibling;
          while (sib && sib.dataset.level >= 4) {
            sib.style.display = '';
            sib = sib.nextElementSibling;
          }
        }
        break;
      }
    }
  }

  // ── Scroll spy ──
  const scroller = document.getElementById('main-scroll');
  const progress = document.getElementById('progress');

  scroller.addEventListener('scroll', () => {
    const { scrollTop, scrollHeight, clientHeight } = scroller;
    const pct = scrollHeight > clientHeight
      ? (scrollTop / (scrollHeight - clientHeight)) * 100
      : 0;
    progress.style.width = pct + '%';

    let active = 0;
    const offset = 80;
    headings.forEach((h, i) => {
      const rect = h.getBoundingClientRect();
      const mainRect = scroller.getBoundingClientRect();
      if (rect.top - mainRect.top <= offset) active = i;
    });
    tocItems.forEach((item, i) => {
      item.el.classList.toggle('active', i === active);
      if (i === active) {
        if (item.level >= 4) expandParentH3(i);
        item.el.scrollIntoView({ block: 'nearest' });
      }
    });
  }, { passive: true });

  // ── Sidebar toggle ──
  const sidebar = document.getElementById('sidebar');
  const toggleButton = document.getElementById('toggle-btn');
  toggleButton.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    toggleButton.setAttribute('aria-expanded', String(!sidebar.classList.contains('collapsed')));
  });
}
</script>
</body>
</html>
